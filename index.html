<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LuaProtecter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #07080c;
            color: #f4f4f5;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            width: min(1400px, 94%);
            margin: auto;
            padding: 28px 0 50px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #8b5cf6, #5b21b6);
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 10px 35px rgba(124, 58, 237, .25);
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: -.5px;
        }

        .brand span {
            color: #858592;
            font-size: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 13px;
            border: 1px solid #20212a;
            background: #0d0e13;
            border-radius: 999px;
            color: #a1a1aa;
            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #71717a;
        }

        .status.ready .status-dot {
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34,197,94,.7);
        }

        .hero {
            margin-bottom: 25px;
        }

        .hero h2 {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 46px);
            letter-spacing: -1.5px;
        }

        .hero p {
            margin: 0;
            color: #858592;
            max-width: 720px;
            line-height: 1.6;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .panel {
            min-width: 0;
            border: 1px solid #20212a;
            background: #0c0d12;
            border-radius: 18px;
            overflow: hidden;
        }

        .panel-header {
            height: 54px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #20212a;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
        }

        .panel-label {
            color: #71717a;
            font-size: 11px;
        }

        textarea,
        #output {
            width: 100%;
            min-height: 420px;
            border: 0;
            outline: 0;
            resize: vertical;
            padding: 18px;
            background: #08090d;
            color: #e4e4e7;
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
            font-size: 13px;
            line-height: 1.65;
        }

        textarea::placeholder {
            color: #52525b;
        }

        #output {
            white-space: pre-wrap;
            overflow: auto;
        }

        .options {
            margin-top: 18px;
            padding: 20px;
            border: 1px solid #20212a;
            background: #0c0d12;
            border-radius: 18px;
        }

        .options-title {
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 700;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border: 1px solid #20212a;
            border-radius: 12px;
            background: #090a0f;
            cursor: pointer;
            transition: .15s ease;
        }

        .option:hover {
            border-color: #3f3f46;
            background: #101116;
        }

        .option input {
            accent-color: #8b5cf6;
        }

        .option strong {
            display: block;
            font-size: 12px;
        }

        .option small {
            display: block;
            margin-top: 3px;
            color: #71717a;
            font-size: 10px;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            border: 1px solid #27272a;
            border-radius: 11px;
            padding: 12px 18px;
            color: #e4e4e7;
            background: #111217;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #181920;
        }

        .primary {
            border-color: #7c3aed;
            background: #7c3aed;
            color: white;
        }

        .primary:hover {
            background: #6d28d9;
        }

        .primary:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            color: #71717a;
            font-size: 12px;
            text-align: right;
        }

        @media (max-width: 850px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
            }

            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="brand">
            <div class="logo">LP</div>

            <div>
                <h1>LuaProtecter</h1>
                <span>Luau protection toolkit</span>
            </div>
        </div>

        <div class="status ready">
            <span class="status-dot"></span>
            Ready
        </div>
    </header>

    <section class="hero">
        <h2>Protect your Luau.</h2>
        <p>
            Transform and protect Luau source with configurable
            protection passes while keeping the generated result valid Luau.
        </p>
    </section>

    <section class="workspace">

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Input</span>
                <span class="panel-label">Luau</span>
            </div>

            <textarea id="input" spellcheck="false"
                placeholder="Paste your Luau code here...">print("hi boi")

local message = "Hello Roblox!"
print(message)</textarea>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Protected Output</span>
                <span class="panel-label">Luau</span>
            </div>

            <div id="output">Protected code will appear here.</div>
        </div>

    </section>

    <section class="options">

        <div class="options-title">
            Protection Options
        </div>

        <div class="options-grid">

            <label class="option">
                <input id="rename" type="checkbox" checked>
                <span>
                    <strong>Identifier Renaming</strong>
                    <small>Rename local identifiers</small>
                </span>
            </label>

            <label class="option">
                <input id="strings" type="checkbox" checked>
                <span>
                    <strong>String Encoding</strong>
                    <small>Encode runtime strings</small>
                </span>
            </label>

            <label class="option">
                <input id="constants" type="checkbox" checked>
                <span>
                    <strong>Constant Protection</strong>
                    <small>Transform numeric constants</small>
                </span>
            </label>

            <label class="option">
                <input id="controlflow" type="checkbox" checked>
                <span>
                    <strong>Control Flow</strong>
                    <small>Protect supported control paths</small>
                </span>
            </label>

            <label class="option">
                <input id="deadcode" type="checkbox">
                <span>
                    <strong>Dead Code</strong>
                    <small>Add semantics-safe decoys</small>
                </span>
            </label>

            <label class="option">
                <input id="decoder" type="checkbox" checked>
                <span>
                    <strong>Runtime Decoder</strong>
                    <small>Decode protected values at runtime</small>
                </span>
            </label>

            <label class="option">
                <input id="vm" type="checkbox">
                <span>
                    <strong>Custom VM</strong>
                    <small>Optional virtualized execution layer</small>
                </span>
            </label>

        </div>

        <div class="controls">
            <button id="clearButton" type="button">
                Clear
            </button>

            <button id="copyButton" type="button">
                Copy Output
            </button>

            <button id="protectButton" class="primary" type="button">
                Protect Luau
            </button>
        </div>

        <div id="message" class="message"></div>

    </section>

</div>

<script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const message = document.getElementById("message");

    const protectButton = document.getElementById("protectButton");
    const clearButton = document.getElementById("clearButton");
    const copyButton = document.getElementById("copyButton");

    function setMessage(text) {
        message.textContent = text;
    }

    clearButton.addEventListener("click", () => {
        input.value = "";
        output.textContent = "Protected code will appear here.";
        setMessage("");
    });

    copyButton.addEventListener("click", async () => {
        const text = output.textContent;

        if (!text || text === "Protected code will appear here.") {
            setMessage("Nothing to copy.");
            return;
        }

        try {
            await navigator.clipboard.writeText(text);
            setMessage("Copied.");
        } catch {
            setMessage("Copy failed.");
        }
    });

    /*
     * Frontend only.
     *
     * The real protection engine belongs to the C++/Luau backend.
     * This page deliberately does NOT attempt to implement a fake
     * JavaScript obfuscator.
     *
     * Once your backend has an HTTP endpoint, this function can POST:
     *
     * {
     *   source,
     *   options
     * }
     *
     * and display the returned protected Luau.
     */
    protectButton.addEventListener("click", async () => {
        const source = input.value.trim();

        if (!source) {
            setMessage("Enter some Luau first.");
            return;
        }

        const options = {
            rename: document.getElementById("rename").checked,
            strings: document.getElementById("strings").checked,
            constants: document.getElementById("constants").checked,
            controlflow: document.getElementById("controlflow").checked,
            deadcode: document.getElementById("deadcode").checked,
            decoder: document.getElementById("decoder").checked,
            vm: document.getElementById("vm").checked
        };

        /*
         * Backend connection placeholder.
         *
         * No application/server is required for this HTML file itself.
         * Your C++ protector will eventually provide the transformation.
         */
        output.textContent =
            "-- LuaProtecter backend not connected yet.\n" +
            "-- Selected protection options:\n" +
            "-- " + JSON.stringify(options, null, 2) + "\n\n" +
            source;

        setMessage("Frontend ready — backend connection not configured.");
    });
</script>

</body>
</html>
